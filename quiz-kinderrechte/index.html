/* Layout: eine grosse Fragekarte fuer Tafel und Beamer, Steuerleiste unten */
:root{
  --akzent:#2a5970; --marker:#f4c20d; --tinte:#19242d; --muted:#596770;
  --line:#d7e1e4; --weich:#edf3f3; --papier:#ffffff; --gruen:#4f7a45; --ton:#bd715e;
  --font-headline:Sniglet,"Century Gothic","Trebuchet MS",sans-serif;
  --font-text:Grundschrift,Andika,"Century Gothic","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--font-text);
  display:flex;flex-direction:column}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:2px solid var(--line)}
.kopf h1{margin:0;font-family:var(--font-headline);font-weight:400;font-size:clamp(20px,2.6vw,28px);color:var(--akzent)}
.punkte{display:flex;gap:6px;flex-wrap:wrap}
.punkte span{width:14px;height:14px;border-radius:50%;border:2px solid var(--akzent)}
.punkte span.da{background:var(--akzent)}
.punkte span.jetzt{background:var(--marker);border-color:var(--tinte)}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,32px);
  width:100%;max-width:1100px;margin:0 auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nr{font-family:var(--font-headline);color:var(--ton);font-size:clamp(18px,2vw,24px)}
.frage{font-size:clamp(26px,3.8vw,46px);line-height:1.3;margin:0;text-wrap:balance}
.frage b{display:block;font-weight:700;margin-top:.3em}
.wahl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.wahl{grid-template-columns:1fr}}
.wahl[hidden]{display:none!important}
.opt{display:flex;align-items:center;gap:16px;text-align:left;font-family:var(--font-text);
  font-size:clamp(22px,2.6vw,32px);line-height:1.25;padding:12px 18px;border-radius:16px;
  border:3px solid var(--akzent);background:#fff;color:var(--tinte);cursor:pointer;min-height:66px}
.opt .bu{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:3px solid var(--akzent);
  display:grid;place-items:center;font-family:var(--font-headline);color:var(--akzent);font-size:24px}
.opt.gewaehlt{background:color-mix(in srgb,var(--marker) 22%,white);border-color:var(--tinte)}
.opt.richtig{border-color:var(--gruen);background:color-mix(in srgb,var(--gruen) 14%,white)}
.opt.richtig .bu{border-color:var(--gruen);color:#fff;background:var(--gruen)}
.opt.weg{opacity:.35}
.erkl{font-size:clamp(22px,2.6vw,32px);line-height:1.35;margin:0;padding:14px 20px;
  border-left:6px solid var(--gruen);background:color-mix(in srgb,var(--gruen) 8%,white);border-radius:0 12px 12px 0}
.leiste{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:2px solid var(--line)}
button.knopf{font-family:var(--font-headline);font-size:clamp(18px,2vw,24px);padding:12px 26px;border-radius:14px;
  border:3px solid var(--akzent);background:#fff;color:var(--akzent);cursor:pointer;min-height:56px}
button.knopf.haupt{background:var(--akzent);color:#fff}
button.knopf:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:4px solid var(--marker);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.opt,.erkl{transition:opacity .2s,background .2s,border-color .2s}}
</style>
</head><body>
<header class="kopf"><h1>Wiederholung zur Probe</h1><div class="punkte" id="punkte"></div></header>
<main>
  <div class="nr" id="nr"></div>
  <p class="frage" id="frage"></p>
  <div class="wahl" id="wahl" hidden></div>
  <p class="erkl" id="erkl" hidden></p>
</main>
<nav class="leiste">
  <button class="knopf" id="zurueck">Zurück</button>
  <button class="knopf haupt" id="schritt">Antworten zeigen</button>
  <button class="knopf" id="weiter">Weiter</button>
